<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelter Auth Portal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; background: #f7f7fb; }
        .navbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
        .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
        label { display: block; font-size: 13px; margin-top: 10px; color: #374151; }
        input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
        button { margin-top: 12px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #111827; color: #fff; cursor: pointer; }
        a.btn { text-decoration: none; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; color: #111827; background: #fff; }
        .pill { display:inline-block; border:1px solid #e5e7eb; background:#fff; color:#374151; border-radius:999px; padding:4px 8px; font-size:12px; }
        .error { margin-bottom: 14px; padding: 10px; border: 1px solid #fecaca; background: #fef2f2; color: #991b1b; border-radius: 8px; }
        .info { margin-bottom: 14px; padding: 10px; border: 1px solid #bfdbfe; background: #eff6ff; color: #1e3a8a; border-radius: 8px; }
        @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-links">
            <a class="btn" href="/shelter/login">Shelter Login</a>
        </div>
        <span class="pill">Authenticated: no</span>
    </div>

    <h1>Shelter Login</h1>
    <p>This page is for Supabase auth. After login, you go to a shelter-specific dashboard.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    {% if info %}
    <div class="info">{{ info }}</div>
    {% endif %}

    <div class="grid">
        <div class="card">
            <h2>Sign In</h2>
            <form method="post" action="/shelter/sign-in">
                <label>Email</label>
                <input name="email" type="email" required />
                <label>Password</label>
                <input name="password" type="password" required />
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div class="card">
            <h2>Sign Up</h2>
            <form method="post" action="/shelter/sign-up">
                <label>First name</label>
                <input name="first_name" type="text" />
                <label>Last name</label>
                <input name="last_name" type="text" />
                <label>Email</label>
                <input name="email" type="email" required />
                <label>Password</label>
                <input name="password" type="password" required />
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>
</body>
</html>
